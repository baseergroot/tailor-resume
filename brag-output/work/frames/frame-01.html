<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>HireFit Brag - Frame 1</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face {
    font-family: 'DM Sans';
    src: local('DM Sans'), local('Inter'), local('Helvetica Neue'), local('Helvetica'), local('Arial');
  }
  :root {
    --mm-primary: #0a0a0a;
    --mm-on-primary: #ffffff;
    --mm-coral: #d4381a;
    --mm-canvas: #ffffff;
    --mm-surface: #f7f8fa;
    --mm-hairline: #e5e7eb;
    --mm-ink: #0a0a0a;
    --mm-steel: #5f5f5f;
    --mm-muted: #a8aab2;
  }
  body {
    width: 1920px;
    height: 1080px;
    font-family: 'DM Sans', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--mm-primary);
    color: var(--mm-on-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
    padding: 8px 16px;
    background: var(--mm-coral);
    color: var(--mm-on-primary);
    animation: pulse 2s ease-in-out infinite;
    margin-bottom: 24px;
    opacity: 0;
    transform: scale(0.8);
    animation: badgeIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards, pulse 2s ease-in-out 0.6s infinite;
  }
  @keyframes badgeIn {
    to { opacity: 1; transform: scale(1); }
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 56, 26, 0.4); }
    50% { box-shadow: 0 0 0 20px rgba(212, 56, 26, 0); }
  }
  h1 {
    font-family: 'DM Sans', 'Inter', sans-serif;
    font-size: clamp(48px, 5vw, 72px);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -1.5px;
    max-width: 1000px;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    animation: textIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
  }
  @keyframes textIn {
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>
  <span class="badge">AI-Powered & Free</span>
  <h1>Get Your Resume Past ATS Filters in 30 Seconds</h1>
</body>
</html>
