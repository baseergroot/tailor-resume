<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>HireFit Brag - Frame 2</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face {
    font-family: 'DM Sans';
    src: local('DM Sans'), local('Inter'), local('Helvetica Neue'), local('Helvetica'), local('Arial');
  }
  :root {
    --mm-primary: #0a0a0a;
    --mm-on-primary: #ffffff;
    --mm-coral: #d4381a;
    --mm-canvas: #ffffff;
    --mm-surface: #f7f8fa;
    --mm-hairline: #e5e7eb;
    --mm-ink: #0a0a0a;
    --mm-steel: #5f5f5f;
    --mm-muted: #a8aab2;
  }
  body {
    width: 1920px;
    height: 1080px;
    font-family: 'DM Sans', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--mm-primary);
    color: var(--mm-on-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    overflow: hidden;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    border-radius: 9999px;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.5;
    padding: 8px 16px;
    background: var(--mm-coral);
    color: var(--mm-on-primary);
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(212, 56, 26, 0.4); }
    50% { box-shadow: 0 0 0 20px rgba(212, 56, 26, 0); }
  }
  h1 {
    font-family: 'DM Sans', 'Inter', sans-serif;
    font-size: clamp(48px, 5vw, 72px);
    font-weight: 600;
    line-height: 1.1;
    letter-spacing: -1.5px;
    max-width: 1000px;
    text-align: center;
  }
  .subheadline {
    font-size: 24px;
    line-height: 1.5;
    color: var(--mm-steel);
    max-width: 800px;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.2s forwards;
  }
  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }
  .cta {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border-radius: 9999px;
    font-family: 'DM Sans', 'Inter', sans-serif;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.4;
    padding: 16px 36px;
    cursor: pointer;
    border: none;
    background: var(--mm-coral);
    color: var(--mm-on-primary);
    opacity: 0;
    transform: scale(0.9);
    animation: scaleIn 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.4s forwards;
  }
  @keyframes scaleIn {
    to { opacity: 1; transform: scale(1); }
  }
  .cta::after {
    content: "→";
    margin-left: 4px;
    transition: transform 0.2s ease;
  }
  .no-signup {
    font-size: 14px;
    color: var(--mm-muted);
    margin-top: 16px;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 0.8s forwards;
  }
</style>
</head>
<body>
  <span class="badge">AI-Powered & Free</span>
  <h1>Get Your Resume Past ATS Filters in 30 Seconds</h1>
  <p class="subheadline">Paste a job description. Upload your resume. Get a tailored resume, ATS score, and cover letter — instantly.</p>
  <button class="cta">Tailor My Resume Free →</button>
  <p class="no-signup">No signup required · First tailoring free · PDF & DOCX supported</p>
</body>
</html>
