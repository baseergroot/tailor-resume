<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1920, height=1080">
<title>HireFit Brag - Frame 9</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  @font-face {
    font-family: 'DM Sans';
    src: local('DM Sans'), local('Inter'), local('Helvetica Neue'), local('Helvetica'), local('Arial');
  }
  :root {
    --mm-primary: #0a0a0a;
    --mm-on-primary: #ffffff;
    --mm-coral: #d4381a;
    --mm-canvas: #ffffff;
    --mm-surface: #f7f8fa;
    --mm-hairline: #e5e7eb;
    --mm-ink: #0a0a0a;
    --mm-steel: #5f5f5f;
    --mm-muted: #a8aab2;
  }
  body {
    width: 1920px;
    height: 1080px;
    font-family: 'DM Sans', 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: var(--mm-primary);
    color: var(--mm-on-primary);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 32px;
    overflow: hidden;
  }
  .logo {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    background: var(--mm-coral);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    font-weight: 700;
    color: var(--mm-on-primary);
    opacity: 0;
    transform: scale(0.8);
    animation: logoIn 0.8s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
  }
  @keyframes logoIn {
    to { opacity: 1; transform: scale(1); }
  }
  .tagline {
    font-size: 18px;
    color: var(--mm-coral);
    font-weight: 600;
    letter-spacing: 0.5px;
    opacity: 0;
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.3s forwards;
  }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .punchline {
    font-family: 'DM Sans', 'Inter', sans-serif;
    font-size: clamp(32px, 4vw, 48px);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -1px;
    max-width: 900px;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.5s forwards;
  }
  .punchline .coral { color: var(--mm-coral); }
  .cta-text {
    font-size: 14px;
    color: var(--mm-muted);
    margin-top: 8px;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
  }
  .domain {
    font-size: 16px;
    color: var(--mm-steel);
    font-weight: 500;
    margin-top: 24px;
    opacity: 0;
    animation: fadeUp 0.6s cubic-bezier(0.22, 1, 0.36, 1) 1.2s forwards;
  }
</style>
</head>
<body>
  <div class="logo">HF</div>
  <p class="tagline">HireFit</p>
  <h1 class="punchline">No signup required. <span class="coral">First tailoring free.</span></h1>
  <p class="cta-text">Paste a JD. Upload your resume. Get hired.</p>
  <p class="domain">hirefit.ai</p>
</body>
</html>
